[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.21",
  "alembic>=1.14",
  "pydantic[email]>=2.12.5",
  "pydantic-settings>=2.7",
  "PyJWT>=2.9",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff>=0.8.4",  # pin aligned with .pre-commit-config.yaml ruff-pre-commit rev
  "mypy",
  "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
include = ["*.py", "**/pyproject.toml"]
exclude = [".venv", "alembic"]
lint.extend-select = ["I", "B", "UP"]
lint.ignore = ["B008"]  # Depends() in default args is the FastAPI pattern
fix = true

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [".venv", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
